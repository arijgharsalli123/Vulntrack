server:
  port: 8083

spring:
  application:
    name: asset-service
  datasource:
    url: jdbc:postgresql://${ASSET_DB_HOST:localhost}:5432/${ASSET_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info